<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table,tr,th,td {
            border-style: solid;
            border-width: 1px;
            padding: 10px;
            margin: 10px;
            border-collapse: collapse;
        }
        th, td {
            text-align: center;
        }

        tr:hover {
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Nama</th>
                <th>Nilai</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Albi</td>
                <td>90</td>
            </tr>
            <tr>
                <td>Rizki</td>
                <td>80</td>
            </tr>
            <tr>
                <td>Albi</td>
                <td>90</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
