<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class</title>
    <style>
        .judul {
            color: red;
            font-size: 30px;
        }
        .merah {
            color: red;
            font-size: 20px;
        }
        .paragraf {
            color: blue;
            font-size: 15px;
        }
         .uppercase {
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <h1 class="header uppercase">Belajar CSS Class</h1>
    <h2 class="judul">ini adalah judul</h2>
    <p class="paragraf">ini adalah paragraf</p>
</body>
</html>
