<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link</title>
    <style>
        a {
            background-color: rgb(255, 255, 255);
            border-color: blueviolet;
            color: blueviolet;
            border-style: solid;
            border-radius: 15px;
            margin: 5px;
            padding: 5px;
            text-decoration: none;
            font-size: 20px;
            text-decoration: none;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        } 

        a:visited {
            color: rgb(242, 150, 150);
            border-color: rgb(242, 150, 150);
        }

        a:hover {
            background-color: rgb(249, 196, 196);
            border-color: rgb(249, 196, 196);
            color: rgb(239, 121, 121);
        }

        div { 
            margin-top: 50px;
        }
    </style>
</head>
<body>
        <div>
            <a href="albyei.web.id">Albi Ariza Syafiq</a>
            <a href="">Albi Aj</a>
        </div>
</body>
</html>
