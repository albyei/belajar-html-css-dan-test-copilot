<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        form {
            background-color: lightgray;
            width: 50%;
            min-width: 200px;
            max-width: 1000px;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
            border-width: 10px;
        }
        #username, #password {
            border-radius: 10px;
            padding: 5px;
         }

         #username:focus, #password:focus {
            background-color: lightgray;
            color: red;
         }

         #input {
            padding: 5px;
            border-radius: 10px;
         }

         #input:hover {
            background-color: lightgray;
         }

    </style>
</head>
<body>
    <form action="">
        <label for="username">
            Username : <br>
            <input type="text" required id="username" name="username"> <br>
        </label>

        <label for="password">
            Password : <br>
            <input type="password" required id="password" name="password"> 
        </label>
        <input type="Submit" id="input">
    </form>
</body>
</html>
