<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        a[target="_blank"] {
            color: rgb(28, 13, 13);
            font-size: 20px;
        }
         p[title^="belajar"] {
            color: red;
            font-size: 20px;
        }
    </style>
    <title>Attribute</title>
</head>
<body>
    <a href="" target="_blank">Contoh 1</a>
    <a href="">Contoh -</a>
    <a href="" target="_blank">Contoh 2</a>
    <a href="" >Contoh 3</a>

    <p title="belajar pemrofgraman">dipilih</p>
    <p title="belajarpemrofgraman">tidak dipilih</p>
    <p title="belajar-pemrofgraman">tidak dipilih</p>
    <p title="pemrofgraman belajar">ini dipilih</p>

</body>
</html>
