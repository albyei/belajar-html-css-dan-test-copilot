<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select</title>
</head>
<body>
    <form action="">
        <label for="jurusan">Pilih Jurusan:</label>
        <select id="jurusan" name="jurusan">
            <optgroup label="Teknik">
                <option value="ti1">Teknik Informatika 1</option>
                <option value="ti2">Teknik Komputer 2</option>
            </optgroup>
            <optgroup label="Manajemen">
                <option value="manajemen1">Manajemen Ekonomi</option>
                <option value="manajemen2">Manajemen Bisnis</option>
            </optgroup>
            <optgroup label="Hukum">
                <option value="hukum">Hukum dan Tatakelola negara</option>
                <option value="hukum2">Hukum Perdata</option>
                <option value="hukum3">Ilmu Politik</option>
            </optgroup>
        </select><br>

        <input type="submit" value="Submit">
</body>
</html>
