<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomor Telepon</title>
</head>
<body>
    <form action="">
        <label for="telp">Nomor Telepon:</label>
        <input type="tel" id="telp" name="telp" pattern="(62) [0-9]{5, 20}" required> <br>
        <small>Format: 62-123-456-7890</small><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
