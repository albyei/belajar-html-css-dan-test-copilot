<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio</title>
</head>
<body>
    <form action="">
        Budi Memiliki Uang Sebesar Rp. 100.000,00. Ia Ingin Membelanjakan Uangnya Untuk Membeli Barang-Barang Berikut: Sabun, Minyak, dan Kertas, berapakah sisa uang Budi setelah membeli barang-barang tersebut?
        <br>

        <input type="radio" id="barang1" name="barang" value="A"><label for="barang1">4.500</label><br>
        <input type="radio" id="barang2" name="barang" value="B"><label for="barang2">5.000</label><br>
        <input type="radio" id="barang3" name="barang" value="C"><label for="barang3">6.000</label><br>
        <input type="radio" id="barang4" name="barang" value="D"><label for="barang4">7.000</label><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
