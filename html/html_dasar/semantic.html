<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=b , initial-scale=1.0">
    <title>Semantic HTML</title>

    <style>
        header {
            background-color: #f55555;
            padding: 30px;
            text-align: center;
            font-size: 35px;
            color: white;
        }

        article {
            background-color: #e6e6e6;
            padding: 20px;
            margin: 20px 0;
        }

        footer {
            background-color: #f6f1f1;
            padding: 20px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #666;
        }

        nav {
            background-color: #aa7575;
            padding: 10px;
            text-align: center;
            color: white;
        }

        nav ul {
            list-style-type: none;
            overflow: hidden;
        }

        nav li {
            float: left;
        }

        nav li a {
            display: block;
            color: white;
            text-align: center;
            padding: 16px;
            text-decoration: none;
        }

        nav li a:hover {
            background-color: #9d7474;
        }

    </style>
</head>
<body>
    <header>
        <h1>
            Judul Halaman
        </h1>
        <nav>
            <ul>
                <li><a href="">Beranda</a></li>
                <li><a href="">Tentang</a></li>
                <li><a href="">Kontak</a></li>
            </ul>
        </nav>
        <section>
            <article>
                <h1>Belajar Semantic pada HTML</h1>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
            </article>

            <article>
                <h1>Belajar Semantic pada CSS</h1>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
            </article>
        </section>
        <footer>
            <p>Copyright &copy; <time datetime="2026">2026</time>"</p>
        </footer>
    </header>
</body>
</html>
