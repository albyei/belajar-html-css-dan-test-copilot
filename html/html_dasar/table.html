<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Tabel</title>
</head>
<body>
    <h1>Belajar Tabel</h1>
    <table style="border: 1px solid black;">    
        <colgroup>
            <col span="1" style="background-color: lightgray;">
            <col span="1" style="background-color: lightblue;">
        </colgroup>
        <thead>
            <tr>
                <th>Nama Depan</th>
                <th>Nilai </th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Albi</td>
                <td>90</td>
            </tr>
            <tr>
                <td>Rizki</td>
                <td>80</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td></td>
                <td>Total</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
